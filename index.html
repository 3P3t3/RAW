<!doctype html>
<meta charset="utf-8">
<title>Aspire Health</title>
<!-- Hand-written, not generated (the build copies it verbatim into plus/). It opens shop.html since
     2026-10-04, when Peter made the Shop the first tab: "Can we swap it so my shop appears first, and
     then the, our approach is actually the second tab?" No hash, so the opening curtain -- which moved
     onto shop.html with it -- plays on arrival. site.webmanifest's start_url is "." and so comes
     through here too. -->
<!-- THE FIRST-VISIT COIN FLIP IS GONE (2026-10-10). From 2026-10-09 this file flipped a coin on a first
     visit and sent that visitor to one of the two build-your-goals variants; Peter retired it -- asked
     which page the site should always open to, he chose the Shop, "always" included. So there is no
     script here at all now, which is the most robust this file can be: no storage read, nothing to
     throw, and the <meta refresh> below is the whole mechanism rather than a fallback behind one.
     THE FUNNEL PAGES ARE STILL BUILT AND STILL LIVE. FUNNELS is untouched, build-your-goals.html and
     -2.html keep their URLs, their canonical and their noindex, and they still record which variant a
     visitor saw -- so an ad can point straight at either one and the A/B test still reads in PostHog.
     What changed is only that ordinary arrivals are no longer diverted into them. Putting the flip
     back is this file plus the check in build_homepage.py that guards the two against drifting. -->
<meta http-equiv="refresh" content="0; url=shop.html">
<link rel="canonical" href="shop.html">
<a href="shop.html">Aspire Health shop</a>
