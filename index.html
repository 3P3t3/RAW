<!doctype html>
<meta charset="utf-8">
<title>Aspire Health</title>
<!-- Hand-written, not generated (the build copies it verbatim into plus/). It opens shop.html since
     2026-10-04, when Peter made the Shop the first tab: "Can we swap it so my shop appears first, and
     then the, our approach is actually the second tab?" No hash, so the opening curtain -- which moved
     onto shop.html with it -- plays on arrival. site.webmanifest's start_url is "." and so comes
     through here too. -->
<!-- FIRST VISIT GOES TO THE FUNNEL (2026-10-09). Eric Elizes: "When someone visits your page for the
     FIRST TIME -> it can auto route them to this page, so you guarantee a new user still always gets the
     First Time User Experience... you could like have a coinflip and auto route randomly between the
     different versions and A/B test". The flip is here and nowhere else.
     THE META REFRESH BELOW IS THE FALLBACK AND MUST STAY: with no script, with storage blocked, or if
     anything in here throws, the visitor simply goes to the shop as they always did. The script runs
     before it on purpose, and location.replace keeps the redirect out of the back button.
     The page names are checked against FUNNELS by the build, because this file is hand-written and
     would otherwise drift silently. The funnel page records which variant it was and that it has been
     seen; this file only decides. -->
<script>
(function(){
  try{
    if(localStorage.getItem('aspire-seen'))return;          /* been here before: on to the shop */
    var v=['build-your-goals.html','build-your-goals-2.html'];
    location.replace(v[Math.random()<0.5?0:1]);
  }catch(e){}
})();
</script>
<meta http-equiv="refresh" content="0; url=shop.html">
<link rel="canonical" href="shop.html">
<a href="shop.html">Aspire Health shop</a>
