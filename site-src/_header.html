<!-- 1 + 2. Header and search -->
<header class="mast" id="top">
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menu" data-open-menu><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <a class="wordmark" href="#top"><svg class="mark" viewBox="0 0 13 22" aria-hidden="true"><path d="M6.5 1L1 21h11L6.5 1zM3.6 13.5h5.8"/></svg>Aspire Health</a>
      <nav class="nav-inline" aria-label="Main">
        <a href="#shop">Shop</a>
        <a href="#goals">Goals</a>
        <a href="#finder" data-open-finder>Finder</a>
      </nav>
      <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Search products" aria-expanded="false" aria-controls="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
    </div>
    <form class="search" id="search" role="search" action="#shop">
      <label class="vh" for="q">Search products</label>
      <input id="q" name="q" type="search" placeholder="Search products" autocomplete="off" enterkeyhint="search">
      <button class="icon-btn search-go" type="submit" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
    </form>
  </div>
</header>
