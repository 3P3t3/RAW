<!doctype html>
<html lang="en"{{HTML_CLASS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
{{HEAD_EXTRA}}<meta name="theme-color" content="#002E3B">
<title>Build your goals · Aspire Health</title>
<meta name="description" content="{{FUNNEL_DESC}}">
<meta property="og:type" content="website">
<meta property="og:title" content="Build your goals · Aspire Health">
<meta property="og:description" content="{{FUNNEL_DESC}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{BASE}}assets/logo/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{BASE}}assets/logo/og-image.png">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/logo/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v38-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-v20-latin.woff2" crossorigin>
<link rel="stylesheet" href="{{STYLE}}">
<script>(function(c){c.add('js');if('IntersectionObserver'in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches)c.add('motion')})(document.documentElement.classList)</script>
{{ANALYTICS}}</head>
<body>
<!-- the field: the site's one ground (the field block in style.css) -->
<div class="field" aria-hidden="true"><span class="fg fg1"></span><span class="fg fg2"></span></div>
<a class="skip" href="#main">Skip to content</a>

{{ICONS}}

{{HEADER}}
{{PIN}}

<main id="main">
  <!-- BUILD YOUR GOALS: the whole first-time funnel on one route (Eric Elizes, 2026-10-09: "anything
       relevant to the first time experience would go here. the entire funnel would live at this route...
       Because the ENTIRE funnel is captured in this 'experience' rather than spread out across different
       pages, you can easily hotswap and test different funnels dynamically"). The two halves — the rack
       and the call — are the SAME two the rest of the site uses, not copies: rack_section() and
       _consult.html. Their order is the variant (FUNNELS in build_homepage.py). -->
  <section class="sec fn-top" id="fn-top" data-funnel="{{FUNNEL_KEY}}" aria-labelledby="fn-title">
    <div class="wrap">
      <!-- DRAFT-COPY -->
      <div class="sec-head grow">
        <p class="label">Build your goals</p>
        <h1 id="fn-title">{{FUNNEL_HEAD}}</h1>
        <p class="fn-lead">{{FUNNEL_LEAD}}</p>
      </div>
      <!-- the way out, for somebody who is not new and did not ask for this (Eric: "if someone isnt new
           also they can x out of it or smth"). It records that they have seen it, so the first-visit
           routing in index.html never sends them back. -->
      <a class="fn-out" href="{{SHOP}}#top" data-funnel-out>Skip this, take me to the shop<svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg></a>
      <!-- /DRAFT-COPY -->
    </div>
  </section>

{{FUNNEL_TOP}}

{{FUNNEL_BOTTOM}}
</main>

{{FOOTER}}

{{DIALOGS}}
{{PCARD}}
<p class="vh" id="live" aria-live="polite"></p>

{{SCRIPT}}
</body>
</html>
