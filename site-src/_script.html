<script>
(function(){
'use strict';
var doc=document,html=doc.documentElement;
function $(s,c){return (c||doc).querySelector(s)}
function $$(s,c){return Array.prototype.slice.call((c||doc).querySelectorAll(s))}
doc.addEventListener('touchstart',function(){},{passive:true}); // enables :active on iOS

var P={{FINDER_DATA}};
var GOALS={R:'Recovery',L:'Lean Mass',E:'Endurance',S:'Sleep & Longevity'};
var live=$('#live');
function say(t){live.textContent='';setTimeout(function(){live.textContent=t},30)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* Motion: reveal on viewport entry */
if(html.classList.contains('motion')){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.15});
  $$('.grow').forEach(function(el){io.observe(el)});
}

/* Hero glass video: plain H.264, so it plays everywhere; the poster shows until it does */
var v=$('#glass-video'),vt=$('#glass-toggle'),userPaused=false;
if(v){
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var setBtn=function(playing){vt.setAttribute('aria-label',playing?'Pause animation':'Play animation');$('use',vt).setAttribute('href',playing?'#i-pause':'#i-play')};
  var play=function(){if(!v.getAttribute('src')){v.autoplay=true;v.src=innerWidth<768?'assets/glass-720.mp4':'assets/glass-1080.mp4'}var p=v.play();if(p&&p.catch)p.catch(function(){})};
  v.addEventListener('play',function(){setBtn(true)});v.addEventListener('pause',function(){setBtn(false)});
  vt.hidden=false;setBtn(false);
  v.addEventListener('error',function(){v.removeAttribute('src');v.load();vt.hidden=true},true);
  vt.addEventListener('click',function(){if(v.paused){userPaused=false;play()}else{userPaused=true;v.pause()}});
  if(still){setBtn(false)}else{
    if(doc.readyState==='complete')play();else window.addEventListener('load',play);
    doc.addEventListener('visibilitychange',function(){if(!doc.hidden&&!userPaused&&v.paused&&v.getAttribute('src'))v.play().catch(function(){})});
    if('IntersectionObserver' in window)new IntersectionObserver(function(es){if(userPaused||!v.getAttribute('src'))return;if(es[0].isIntersecting)v.play().catch(function(){});else v.pause()}).observe(v);
  }
}
/* Phone search: the icon opens the search row */
var mast=$('.mast'),st=$('#search-toggle');
st.addEventListener('click',function(){var o=mast.classList.toggle('s-open');st.setAttribute('aria-expanded',o);if(o)$('#q').focus()});

/* The full shelf: hidden until you search or ask for it. Category pages have a grid but no filter bar. */
var grid=$('#grid'),cards=grid?$$('#grid > li'):[],fbar=$('#filter'),ftext=$('#filter-text'),
    results=$('#results'),shopTitle=$('#shop-title'),q=$('#q');
cards.forEach(function(li){li._s=li.textContent.toLowerCase()});
function show(test,msg){
  var n=0;
  cards.forEach(function(li){var on=!test||test(li);li.hidden=!on;if(on)n++});
  if(fbar&&msg){fbar.hidden=false;ftext.textContent=msg(n);say(ftext.textContent)}
  return n;
}
function goShop(){
  if(results)results.hidden=false;
  var t=results||$('#all');if(t)t.scrollIntoView();
  if(shopTitle)shopTitle.focus({preventScroll:true});
}
function showAll(){show(null,function(n){return 'All '+n+' products'});goShop()}
function search(t){
  var words=t.split(/\s+/);
  show(function(li){return words.every(function(w){return li._s.indexOf(w)>-1})},
       function(n){return n?n+' result'+(n===1?'':'s')+' for “'+t+'”':'Nothing matches “'+t+'”. Try a goal, like sleep.'});
  goShop();
}
$$('[data-all]').forEach(function(a){a.addEventListener('click',function(e){
  if(!results)return;                      /* category pages just follow the link home */
  e.preventDefault();if(menu&&menu.open)menu.close();showAll();
})});
if($('#filter-clear'))$('#filter-clear').addEventListener('click',function(){
  q.value='';show();if(results)results.hidden=true;
  var g=$('#goals');if(g)g.scrollIntoView();
});
$('#search').addEventListener('submit',function(e){
  e.preventDefault();var t=q.value.trim().toLowerCase();
  if(!t){showAll();return}
  if(!grid||!fbar){location.href='homepage.html?q='+encodeURIComponent(t);return}   /* search lives on the homepage */
  search(t);q.blur();
});
var urlQ=new URLSearchParams(location.search).get('q');
if(urlQ&&grid&&fbar){q.value=urlQ;search(urlQ.toLowerCase())}
else if(results&&location.hash==='#results')showAll();          /* arrived from another page */
var ALL_HREF=results?'#results':'homepage.html#results';

/* Flavour carousel: a continuous glide that wraps, until the arrows or a swipe take over */
var car=$('#carousel');
if(car){
  var slideW=function(){var s=car.firstElementChild;return s?s.getBoundingClientRect().width+parseFloat(getComputedStyle(car).columnGap||16):300},
      go=function(d){var max=car.scrollWidth-car.clientWidth-4;
        car.scrollTo({left:car.scrollLeft>=max&&d>0?0:Math.max(0,car.scrollLeft+d*slideW()),behavior:'smooth'})};
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches,
      raf=null,last=0,hold=false,taken=still;   /* taken: the reader is driving, so the glide stays off */
  /* a second copy of the flavours, so the wrap has nothing to give it away */
  if(!still){
    $$('.slide',car).forEach(function(li){
      var c=li.cloneNode(true);
      c.setAttribute('aria-hidden','true');
      $$('a',c).forEach(function(a){a.tabIndex=-1});
      car.appendChild(c);
    });
  }
  var lap=function(){return car.scrollWidth/2};
  var frame=function(t){
    var dt=last?Math.min(t-last,60):16;
    last=t;
    if(!hold){
      car.scrollLeft+=dt*0.048;                 /* about 48px a second: one flavour every six or so */
      if(car.scrollLeft>=lap())car.scrollLeft-=lap();
    }
    raf=requestAnimationFrame(frame);
  };
  var glide=function(){
    if(taken||raf)return;
    car.classList.add('gliding');               /* snap points fight a continuous scroll */
    last=0;raf=requestAnimationFrame(frame);
  };
  var park=function(){
    if(!raf)return;
    cancelAnimationFrame(raf);raf=null;
    car.classList.remove('gliding');
  };
  var handOver=function(){taken=true;park()};   /* once they steer, it stays theirs */
  $$('[data-car]').forEach(function(b){b.addEventListener('click',function(){handOver();go(+b.dataset.car)})});
  ['pointerdown','wheel','focusin'].forEach(function(ev){car.addEventListener(ev,handOver,{passive:true})});
  car.addEventListener('mouseenter',function(){hold=true});
  car.addEventListener('mouseleave',function(){hold=false});
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){es[0].isIntersecting?glide():park()},{threshold:.2}).observe(car);
  else glide();
}

/* Dialogs: full-screen menu + finder sheet */
var menu=$('#menu'),sheet=$('#finder-sheet');
function openD(d){if(!d.open){d.showModal();html.classList.add('locked')}}
[menu,sheet].forEach(function(d){
  d.addEventListener('close',function(){if(!menu.open&&!sheet.open)html.classList.remove('locked')});
  d.addEventListener('click',function(e){if(e.target===d)d.close()});
});
$$('[data-open-menu]').forEach(function(b){b.addEventListener('click',function(){openD(menu)})});
$$('[data-close]').forEach(function(b){b.addEventListener('click',function(){b.closest('dialog').close()})});
$$('a',menu).forEach(function(a){a.addEventListener('click',function(){menu.close()})});
/* the menu button survives to 1024 now, so only close the panel where the inline nav takes over */
matchMedia('(min-width: 1024px)').addEventListener('change',function(m){if(m.matches&&menu.open)menu.close()});

/* Finder: three questions, one per screen, two results */
var Q=[
  {q:'What does most of your training look like?',o:[['Lifting and strength work','Lifting',{L:2,R:1}],['Running, cycling or rowing','Endurance',{E:2,R:1}],['A mix of everything','Mixed',{L:1,E:1,R:1}],['Walking, yoga, staying mobile','Mobility',{S:2,R:1}]]},
  {q:'What would help most right now?',o:[['Recovering between sessions','Recovery',{R:3}],['Building or keeping muscle','Muscle',{L:3}],['Energy and hydration for long efforts','Energy',{E:3}],['Winding down and sleeping well','Sleep',{S:3}]]},
  {q:'How do you like to take it?',o:[['Powder, mixed into a drink','Powder',{powder:1.5}],['Ready to drink or eat','Ready',{ready:1.5}],['Tablets, capsules or gummies','Tablets',{pills:1.5}],['No preference','Either',{}]]}
];
var fBody=$('#finder-body'),fStep=$('#finder-step'),fBack=$('#finder-back'),step=0,ans=[];
function picks(){
  var w={R:0,L:0,E:0,S:0,powder:0,ready:0,pills:0};
  ans.forEach(function(a,i){var m=Q[i].o[a][2];for(var k in m)w[k]+=m[k]});
  return Object.keys(P).map(function(id,i){
    var p=P[id],s=w[p.form]||0;
    p.g.split('').forEach(function(g,j){s+=w[g]*(j?.6:1)});
    return {id:id,s:s,i:i};
  }).sort(function(a,b){return b.s-a.s||a.i-b.i}).slice(0,2);
}
function render(focus){
  fBack.style.visibility=step?'visible':'hidden';
  if(step<Q.length){
    var c=Q[step];
    fStep.textContent='Question '+(step+1)+' of '+Q.length;
    fBody.innerHTML='<h2 class="q" id="finder-title" tabindex="-1">'+c.q+'</h2><div class="opts">'+c.o.map(function(o,i){
      var on=ans[step]===i;
      return '<button type="button" class="opt'+(on?' is-picked':'')+'" data-i="'+i+'"><span>'+o[0]+(on?'<span class="vh"> (your earlier answer)</span>':'')+'</span><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></button>';
    }).join('')+'</div>';
  }else{
    fStep.textContent='Your match';
    fBody.innerHTML='<h2 class="q" id="finder-title" tabindex="-1">Two to start with</h2><p class="basis">Based on: '+ans.map(function(a,i){return Q[i].o[a][1]}).join(' · ')+'</p><ul class="picks">'+picks().map(function(r){
      var p=P[r.id];
      return '<li class="pick"><span class="shot"><img src="'+esc(p.img)+'" alt="" width="480" height="480"></span><div><h3 class="p-name">'+esc(p.name)+'</h3><p class="p-desc">'+esc(p.desc)+'</p><p class="why">'+esc(p.why)+'</p><a class="buy" href="'+esc(p.url)+'" target="_blank" rel="noopener">Buy on Amway<span class="vh"> '+esc(p.name)+' (opens in a new tab)</span></a></div></li>';
    }).join('')+'</ul><div class="sheet-foot"><button class="tlink" type="button" id="finder-restart">Start over</button><a class="tlink" href="'+ALL_HREF+'" id="finder-shop">See all products</a></div>';
  }
  if(focus)$('#finder-title').focus();
}
fBody.addEventListener('click',function(e){
  var o=e.target.closest('.opt');
  if(o){ans[step]=+o.dataset.i;step++;render(true);return}
  if(e.target.closest('#finder-restart')){step=0;ans=[];render(true);return}
  if(e.target.closest('#finder-shop')){sheet.close();if(results){e.preventDefault();showAll()}}
});
fBack.addEventListener('click',function(){if(step){step--;render(true)}});
$$('.q-opt').forEach(function(b){b.addEventListener('click',function(){ans=[+b.dataset.first];step=1;render(false);openD(sheet);$('#finder-title').focus()})});
$$('[data-open-finder]').forEach(function(b){b.addEventListener('click',function(e){
  e.preventDefault();
  if(menu.open)menu.close();
  if(step>=Q.length){step=0;ans=[]}
  render(false);openD(sheet);$('#finder-title').focus();
})});

/* Light through glass: a small caustics shader over the category banner */
$$('[data-caustics]').forEach(function(cv){
  if(!html.classList.contains('motion'))return;
  var gl=cv.getContext('webgl');
  if(!gl)return;
  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs='precision mediump float;uniform vec2 r;uniform float t;'+
    'float n(vec2 p){return sin(p.x)*sin(p.y);}'+
    'void main(){vec2 u=(gl_FragCoord.xy/r.y)*3.0;float a=0.0;'+
    'for(int i=0;i<4;i++){float f=float(i)+1.0;'+
    'a+=n(u*f+vec2(t*0.25*f,t*0.18*f))/f;'+
    'a+=n(u.yx*f*1.3-vec2(t*0.2*f,t*0.31*f))/f;}'+
    'float c=smoothstep(0.55,1.25,abs(a)*1.6);'+
    'gl_FragColor=vec4(vec3(1.0,0.99,0.96),c*0.5);}';
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr);gl.useProgram(pr);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  var uR=gl.getUniformLocation(pr,'r'),uT=gl.getUniformLocation(pr,'t'),run=true,t0=performance.now();
  function size(){var d=Math.min(devicePixelRatio||1,1.5);cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;gl.viewport(0,0,cv.width,cv.height)}
  addEventListener('resize',size);size();
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){run=es[0].isIntersecting;if(run)frame()},{threshold:0}).observe(cv);
  function frame(){if(!run)return;gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,(performance.now()-t0)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}
  frame();
});

/* Banner art drifts a little as the page scrolls */
var bg=$('.cat-bg');
if(bg&&html.classList.contains('motion')){
  var ticking=false;
  addEventListener('scroll',function(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){bg.style.transform='translate3d(0,'+Math.min(scrollY*.18,120)+'px,0) scale(1.08)';ticking=false});
  },{passive:true});
}

/* Podium: packs tilt toward the pointer, and the week's count counts up */
var tilts=$$('.tilt');
if(tilts.length&&html.classList.contains('motion')){
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(fine){
    tilts.forEach(function(el){
      var box=el.parentNode;
      box.addEventListener('pointermove',function(e){
        var r=box.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        el.style.transform='rotateY('+(x*14).toFixed(2)+'deg) rotateX('+(-y*12).toFixed(2)+'deg) translate3d('+(x*10).toFixed(1)+'px,'+(y*8-6).toFixed(1)+'px,0) scale(1.03)';
      });
      box.addEventListener('pointerleave',function(){el.style.transform=''});
    });
  }else{
    /* phones: a slow, shared drift so the packs still feel three-dimensional */
    var t0=performance.now(),drift=function(){
      var t=(performance.now()-t0)/1000;
      tilts.forEach(function(el,i){
        var a=t*.6+i*2.1;
        el.style.transform='rotateY('+(Math.sin(a)*5).toFixed(2)+'deg) rotateX('+(Math.cos(a*.8)*3).toFixed(2)+'deg)';
      });
      requestAnimationFrame(drift);
    };
    var seen=false;
    if('IntersectionObserver' in window)new IntersectionObserver(function(es){
      if(es[0].isIntersecting&&!seen){seen=true;drift()}
    },{threshold:.2}).observe(tilts[0].parentNode);
  }
}
$$('.pod-num').forEach(function(el){
  var to=+el.dataset.count;
  if(!to)return;
  var run=function(){
    var t0=performance.now(),step=function(){
      var k=Math.min(1,(performance.now()-t0)/900);
      el.textContent=Math.round(to*(1-Math.pow(1-k,3)));
      if(k<1)requestAnimationFrame(step);
    };step();
  };
  if(!html.classList.contains('motion')){el.textContent=to;return}
  if('IntersectionObserver' in window)new IntersectionObserver(function(es,o){if(es[0].isIntersecting){run();o.disconnect()}},{threshold:.6}).observe(el);
  else run();
});

/* Shelves, strip view: tabs switch panels. The ring below is the other view of the same data. */
var tablist=$('.shelf-tabs');
if(tablist){
  var tabs=$$('.shelf-tab',tablist);
  var pick=function(i,focus){
    tabs.forEach(function(t,j){
      var on=i===j;
      t.setAttribute('aria-selected',on);
      t.tabIndex=on?0:-1;
      var panel=$('#'+t.getAttribute('aria-controls'));
      if(panel)panel.hidden=!on;
    });
    if(focus)tabs[i].focus();
    tabs[i].scrollIntoView({block:'nearest',inline:'nearest'});
  };
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){pick(i)});
    t.addEventListener('keydown',function(e){
      var n=tabs.length,k=e.key,
          j=k==='ArrowRight'?(i+1)%n:k==='ArrowLeft'?(i+n-1)%n:k==='Home'?0:k==='End'?n-1:-1;
      if(j<0)return;
      e.preventDefault();pick(j,true);
    });
  });
}

/* The archipelago: islands drift around a slow ellipse, each bobbing on its own */
var arch=$('#archipelago');
if(arch){
  var isles=$$('.isle',arch),tog=$('#isles-toggle'),N=isles.length,ang=0,last=0,paused=false,raf=null;
  var geom={base:150,rx:200,ry:70,wide:false};
  var measure=function(){
    var w=arch.clientWidth;
    geom.wide=w>=768;
    geom.base=geom.wide?Math.min(216,w*.18):Math.min(158,w*.38);
    geom.rx=geom.wide?w/2-geom.base*.55:w*.40;       /* the ring stays inside the frame: nothing is sliced */
    geom.ry=geom.wide?66:38;
    isles.forEach(function(el){el.style.setProperty('--w',Math.round(geom.base)+'px')});  /* size set once, not per frame */
  };
  var cap=$('#isle-caption'),capName=cap&&$('.isle-name',cap),capNote=cap&&$('.isle-note',cap),front=-1;
  var layout=function(){
    var now=performance.now(),best=0,bestF=-1;
    isles.forEach(function(el,i){
      var a=ang+i*2*Math.PI/N,d=Math.cos(a),f=(d+1)/2,
          k=(geom.wide?.70:.55)+(geom.wide?.30:.45)*f;   /* depth: the far side reads as background */
      if(f>bestF){bestF=f;best=i}
      var bob=Math.sin(now/1000*.55+i*1.7)*(geom.wide?9:6);
      var y=-geom.base*.52*k-d*geom.ry+bob;
      /* transform and opacity only: both composite, so the ring stays smooth */
      el.style.transform='translate3d('+(Math.sin(a)*geom.rx).toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+k.toFixed(3)+')';
      el.style.opacity=((geom.wide?.62:.5)+(geom.wide?.38:.5)*f).toFixed(2);
      el.style.zIndex=Math.round(f*100);
    });
    if(cap&&best!==front){                       /* one caption, for whichever shelf is in front */
      front=best;
      capName.textContent=$('.isle-name',isles[best]).textContent;
      capNote.textContent=$('.isle-note',isles[best]).textContent;
    }
  };
  var frame=function(t){
    if(!paused){var dt=last?Math.min(t-last,60):16;ang+=dt*0.00042}   /* one lap in about 12s */
    last=t;layout();raf=requestAnimationFrame(frame);
  };
  var stop=function(){paused=true;tog.setAttribute('aria-label','Start the islands');$('use',tog).setAttribute('href','#i-play')};
  var start=function(){paused=false;tog.setAttribute('aria-label','Pause the islands');$('use',tog).setAttribute('href','#i-pause')};
  measure();layout();                         /* place them before the first paint */
  addEventListener('load',function(){measure();layout()});
  if(html.classList.contains('motion')){
    tog.hidden=false;
    tog.addEventListener('click',function(){paused?start():stop()});
    arch.addEventListener('pointerenter',function(){paused=true});
    arch.addEventListener('pointerleave',function(){if(tog.getAttribute('aria-label')!=='Start the islands')paused=false});
    arch.addEventListener('focusin',function(){paused=true});
    addEventListener('resize',function(){measure();layout()});
    if('IntersectionObserver' in window)new IntersectionObserver(function(es){
      if(es[0].isIntersecting){if(!raf)raf=requestAnimationFrame(frame)}
      else if(raf){cancelAnimationFrame(raf);raf=null;last=0}
    },{threshold:.05}).observe(arch);
    else raf=requestAnimationFrame(frame);
  }else{
    measure();layout();addEventListener('resize',function(){measure();layout()});   /* reduced motion: a still archipelago */
  }
}

/* Consult: the calendar embeds in place of the form, the four answers prefilled as a1-a4
   (Calendly maps those positionally onto the event type's custom questions) */
var cform=$('#consult-form');
if(cform){
  var csum=$('#consult-sum'),cbox=$('#consult-embed'),
      val=function(n){var el=cform.elements[n];return ((el&&el.value)||'').trim()};
  var line=function(){
    var g=val('goal'),t=val('training');
    if(!g&&!t)return 'On video or by phone.';
    return 'Fifteen minutes on '+(g?g.toLowerCase():'your goal')+(t?', training '+t.toLowerCase():'')+'.';
  };
  cform.addEventListener('change',function(){csum.textContent=line()});
  /* widget.js is only fetched on submit, once, so nobody who never books pays for it */
  var wjs=0,wq=[];
  var withCalendly=function(fn,fail){
    if(window.Calendly)return fn();
    wq.push(fn);
    if(wjs)return;
    wjs=1;
    var sc=doc.createElement('script');
    sc.src='https://assets.calendly.com/assets/external/widget.js';
    sc.async=true;
    sc.onload=function(){wq.splice(0).forEach(function(f){f()})};
    sc.onerror=function(){wjs=0;wq.length=0;fail()};
    doc.head.appendChild(sc);
  };
  cform.addEventListener('submit',function(e){
    e.preventDefault();
    var url=cform.dataset.consult;
    if(!url){                                   /* no calendar connected yet: say so rather than embed nothing */
      csum.textContent='Your answers are ready. The booking calendar connects here shortly.';
      return;
    }
    /* a1-a4 go in the embed url itself; widget.js drops a prefill object for custom answers */
    var qs=[];
    [val('goal'),val('training'),val('stack'),val('note')].forEach(function(v,i){
      if(v)qs.push('a'+(i+1)+'='+encodeURIComponent(v));
    });
    csum.textContent='Loading the calendar with your answers.';
    withCalendly(function(){
      cbox.hidden=false;
      /* colours lifted from style.css: --chalk, --ink, --teal */
      window.Calendly.initInlineWidget({
        url:url+(url.indexOf('?')>-1?'&':'?')+
            'hide_gdpr_banner=1&background_color=f4f2ec&text_color=1e262f&primary_color=002e3b'+
            (qs.length?'&'+qs.join('&'):''),
        parentElement:cbox
      });
      cform.hidden=true;
      say('Calendar loaded. Pick a time.');
    },function(){
      csum.textContent='The calendar did not load. Try again in a moment.';
    });
  });
}

/* The pour: 150 frames of the can going into the glass, scrubbed by scroll position.
   Nothing is fetched until the section comes near, and reduced motion gets one still. */
(function(){
  var run=$('#pour-run');
  if(!run)return;
  var stage=$('.pour-stage',run),cv=$('#pour-film'),still=$('#pour-still'),
      head=$('.pour-head',run),cap=$('.pour-cap',run),cues=$$('.pour-cue',run);
  /* phones take the light set, big screens the tall one; picked when the first
     frame is actually wanted, so the window has been laid out by then */
  var DIR='assets/pour/sm';
  function pick(){
    var big=innerWidth>900||((devicePixelRatio||1)>2&&innerWidth>480);
    DIR='assets/pour/'+(big?'big':'sm');
  }
  var FRAMES=150,PPF=12,CACHE=28,AHEAD=10;
  var MAXSTEP=3;     /* frames per display frame at most: a flick plays, never cuts */
  var STILL=59;      /* the one frame reduced motion shows: the can mid-pour */
  function url(i){return DIR+'/'+('000'+(i+1)).slice(-4)+'.webp'}

  /* one frame, no scrub, and none of the other 149 fetched */
  function poster(){
    pick();still.alt=cv.getAttribute('aria-label');still.src=url(STILL);
    still.hidden=false;cv.hidden=true;if(cap)cap.hidden=true;
  }
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gate='IntersectionObserver' in window;
  if(!gate||!window.createImageBitmap){poster();return}   /* no gate, no bulk fetch */
  if(reduced){
    new IntersectionObserver(function(es,o){if(es[0].isIntersecting){poster();o.disconnect()}},
      {rootMargin:'200px 0px'}).observe(run);
    return;
  }

  var ctx=cv.getContext('2d',{alpha:false});
  var blobs=new Array(FRAMES),bmps=new Array(FRAMES),used=[];
  var w=0,h=0,pos=0,target=0,dir=1,raf=0,drawn='';

  /* Load coarse to fine: every 8th frame first, then 4th, 2nd, the rest. A quick
     scroll on a slow connection plays a rougher pour instead of stalling. */
  function order(){
    var seen={},out=[];
    [8,4,2,1].forEach(function(s){for(var i=0;i<FRAMES;i+=s)if(!seen[i]){seen[i]=1;out.push(i)}});
    if(!seen[FRAMES-1])out.splice(1,0,FRAMES-1);
    return out;
  }
  function load(){
    pick();
    var queue=order(),live=0;
    (function pump(){
      while(live<4&&queue.length){                    /* a few requests in flight */
        var k=queue.shift();live++;
        (function(k){
          fetch(url(k)).then(function(r){return r.blob()}).then(function(bl){
            blobs[k]=bl;if(Math.abs(k-pos)<=AHEAD)decode(k);
          }).catch(function(){}).then(function(){live--;pump()});
        })(k);
      }
    })();
  }

  /* Decoded frames are big; keep a window around the playhead, not the whole clip. */
  function decode(i){
    if(i<0||i>=FRAMES||bmps[i]||!blobs[i])return;
    bmps[i]='pending';
    createImageBitmap(blobs[i]).then(function(bm){
      bmps[i]=bm;used.push(i);
      while(used.length>CACHE){                       /* drop the frame furthest away */
        var far=0;
        for(var j=1;j<used.length;j++)
          if(Math.abs(used[j]-pos)>Math.abs(used[far]-pos))far=j;
        var gone=used.splice(far,1)[0];
        if(bmps[gone]&&bmps[gone].close)bmps[gone].close();
        bmps[gone]=null;
      }
      paint(true);
    }).catch(function(){bmps[i]=null});
  }
  function ready(i){return bmps[i]&&bmps[i]!=='pending'}
  function nearest(i){
    for(var d=0;d<FRAMES;d++){if(ready(i-d))return i-d;if(ready(i+d))return i+d}
    return -1;
  }
  function blit(bm,alpha){
    var s=Math.max(w/bm.width,h/bm.height),dw=bm.width*s,dh=bm.height*s;
    ctx.globalAlpha=alpha;ctx.drawImage(bm,(w-dw)/2,(h-dh)/2,dw,dh);ctx.globalAlpha=1;
  }
  /* Draw the playhead between two frames: the next one fades over the first by the
     fraction in between, so scroll positions between frames become motion. */
  function paint(force){
    var i=Math.floor(pos),f=pos-i,key;
    for(var k=1;k<=AHEAD;k++)decode(i+k*dir);
    decode(i);decode(i+1);decode(i-dir);
    var a=ready(i)?i:nearest(i);
    if(a<0)return;
    var b=a===i&&f>0.02&&ready(i+1)?i+1:-1;
    key=a+':'+(b<0?0:Math.round(f*20));
    if(key===drawn&&!force)return;
    drawn=key;
    blit(bmps[a],1);
    if(b>=0)blit(bmps[b],f);
  }
  function size(){
    var r=Math.min(devicePixelRatio||1,2);
    w=stage.offsetWidth;h=stage.offsetHeight;
    cv.width=Math.round(w*r);cv.height=Math.round(h*r);
    ctx.setTransform(r,0,0,r,0,0);
    ctx.imageSmoothingQuality='high';
    run.style.height=(h+FRAMES*PPF)+'px';             /* the scroll the film is scrubbed by */
    drawn='';paint(true);
  }
  /* measured live: the sections above this one change height as the shelf opens */
  function progress(){
    return Math.min(1,Math.max(0,-run.getBoundingClientRect().top/(FRAMES*PPF)));
  }
  /* The playhead eases toward the scroll position instead of jumping to it, so a
     flick of the thumb plays through frames rather than cutting. */
  function step(){
    raf=0;
    var d=target-pos;
    if(Math.abs(d)<0.01)pos=target;
    else{dir=d>0?1:-1;var v=d*0.22;pos+=Math.max(-MAXSTEP,Math.min(MAXSTEP,v))}
    paint(false);
    var p=pos/(FRAMES-1);
    if(head)head.style.opacity=String(Math.max(0,1-p*3));    /* the title clears early */
    if(cap)cap.style.opacity=String(Math.max(0,1-p*8));
    for(var c=0;c<cues.length;c++){                          /* captions ride the scrub */
      var a=+cues[c].dataset.a,b=+cues[c].dataset.b,e=0.06;
      cues[c].style.opacity=String(Math.max(0,Math.min(1,(p-a)/e,(b-p)/e)));
    }
    if(pos!==target)raf=requestAnimationFrame(step);
  }
  function onScroll(){
    target=progress()*(FRAMES-1);
    if(!raf)raf=requestAnimationFrame(step);
  }
  size();
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',function(){
    /* height-only changes (mobile Safari's toolbar) must not re-size the stage */
    if(stage.offsetWidth===w&&stage.offsetHeight===h)return;
    size();onScroll();
  });
  /* the gate: the first frame request happens here, not on page load */
  new IntersectionObserver(function(es,o){
    if(!es[0].isIntersecting)return;
    o.disconnect();load();onScroll();
  },{rootMargin:'400px 0px'}).observe(run);
})();

/* Interface sound: short glassy ticks, synthesised here so there is nothing to download */
(function(){
  var btn=$('#sound-toggle');
  if(!btn||!(window.AudioContext||window.webkitAudioContext))return;
  var KEY='aspire-sound',on=true;
  try{on=localStorage.getItem(KEY)!=='off'}catch(e){}
  var ctx=null,bus=null;
  function wake(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      bus=ctx.createGain();bus.gain.value=.5;
      var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=220;
      bus.connect(hp);hp.connect(ctx.destination);
    }
    if(ctx.state==='suspended')ctx.resume();
  }
  /* one tick = two detuned partials through a soft bandpass, 40-140ms */
  function tick(f,dur,vol,type){
    if(!on)return;
    wake();
    var t=ctx.currentTime,g=ctx.createGain(),bp=ctx.createBiquadFilter();
    bp.type='bandpass';bp.frequency.value=f*1.6;bp.Q.value=.8;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    [1,1.503].forEach(function(m,i){
      var o=ctx.createOscillator();
      o.type=type||'triangle';
      o.frequency.setValueAtTime(f*m*(1+(Math.random()-.5)*.02),t);
      o.frequency.exponentialRampToValueAtTime(f*m*.86,t+dur);
      var og=ctx.createGain();og.gain.value=i?.35:1;
      o.connect(og);og.connect(bp);o.start(t);o.stop(t+dur+.02);
    });
    bp.connect(g);g.connect(bus);
  }
  var sounds={
    tap:function(){tick(1180,.09,.10)},          /* links, cards, options */
    go:function(){tick(760,.16,.12,'sine')},      /* primary buttons */
    isle:function(){tick(430,.22,.13,'sine')},    /* an island opening */
    soft:function(){tick(1560,.05,.045)}          /* small controls */
  };
  doc.addEventListener('pointerdown',function(e){
    var t=e.target.closest('a,button,.chip');
    if(!t||t.id==='sound-toggle')return;
    if(t.closest('.isle'))return sounds.isle();
    if(t.classList.contains('btn'))return sounds.go();
    if(t.classList.contains('icon-btn')||t.classList.contains('chip')||t.closest('.q-opt,.opt'))return sounds.soft();
    sounds.tap();
  },{passive:true});
  function paint(){
    btn.setAttribute('aria-pressed',on);
    btn.setAttribute('aria-label',on?'Turn interface sounds off':'Turn interface sounds on');
    $('use',btn).setAttribute('href',on?'#i-sound':'#i-mute');
  }
  btn.addEventListener('click',function(){
    on=!on;try{localStorage.setItem(KEY,on?'on':'off')}catch(e){}
    paint();if(on){wake();sounds.tap()}
  });
  btn.hidden=false;paint();
})();
})();
</script>
